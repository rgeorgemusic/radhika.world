<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radhika.world</title>

  <style>
    @keyframes glitch-anim {
      0% { clip: rect(24px, 9999px, 90px, 0); transform: skew(0.3deg); }
      10% { clip: rect(10px, 9999px, 50px, 0); transform: skew(0.8deg); }
      20% { clip: rect(50px, 9999px, 140px, 0); transform: skew(0.1deg); }
      30% { clip: rect(80px, 9999px, 120px, 0); transform: skew(0.5deg); }
      40% { clip: rect(20px, 9999px, 100px, 0); transform: skew(0.6deg); }
      50% { clip: rect(60px, 9999px, 150px, 0); transform: skew(0.2deg); }
      60% { clip: rect(5px, 9999px, 80px, 0); transform: skew(0.4deg); }
      70% { clip: rect(30px, 9999px, 130px, 0); transform: skew(0.7deg); }
      80% { clip: rect(10px, 9999px, 90px, 0); transform: skew(0.9deg); }
      90% { clip: rect(40px, 9999px, 110px, 0); transform: skew(0.3deg); }
      100% { clip: rect(24px, 9999px, 90px, 0); transform: skew(0.5deg); }
    }

    body {
      background-color: black;
      font-family: 'Courier New', monospace;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    /* ---- START BUTTON ---- */
    #start-btn {
      font-size: 2rem;
      color: white;
      background: none;
      border: 2px solid white;
      padding: 0.5rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      z-index: 20;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    #start-btn:hover {
      background: white;
      color: black;
    }

    /* ---- GLITCH TITLE ---- */
    a.glitch {
      font-size: 6rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-transform: uppercase;
      z-index: 10;
      text-decoration: none;
      text-shadow: 0 0 1px white, 0 0 2px white, 0 0 5px white;
      display: none; /* hidden until start */
    }

    a.glitch::before,
    a.glitch::after {
      content: "Radhika.world";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      font-weight: 900;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }

    a.glitch::before {
      text-shadow: -2px 0 cyan;
      animation: glitch-anim 2s infinite linear alternate-reverse;
    }

    a.glitch::after {
      text-shadow: 2px 0 magenta;
      animation: glitch-anim 3s infinite linear alternate-reverse;
    }

    /* ---- ENTER BUTTON ---- */
    a#enter {
      position: absolute;
      font-size: 2rem;
      color: #ffffff;
      text-decoration: none;
      border: 2px solid #ffffff;
      padding: 0.3rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      z-index: 5;
      display: none; /* hidden until start */
    }

    a#enter:hover {
      background-color: white;
      color: black;
    }
  </style>
</head>

<body>

  <!-- Background Music -->
  <audio id="bg-music" loop preload="auto">
    <source src="music/NuSong.wav" type="audio/wav">
  </audio>

  <!-- START BUTTON -->
  <button id="start-btn">Start</button>

  <!-- Main Title -->
  <a href="home.html" class="glitch">Radhika.world</a>

  <!-- Enter Button -->
  <a href="home.html" id="enter">Click to Enter</a>

  <script>
    const startBtn = document.getElementById("start-btn");
    const enter = document.getElementById("enter");
    const glitch = document.querySelector("a.glitch");
    const music = document.getElementById("bg-music");

    let musicStarted = false;
    let dvdAnimationStarted = false;

    startBtn.addEventListener("click", () => {
      // Hide start button
      startBtn.style.display = "none";

      // Show title and enter button
      glitch.style.display = "block";
      enter.style.display = "block";

      // Play music
      music.volume = 0.5;
      music.muted = false;
      music.play().then(() => {
        musicStarted = true;
      }).catch(err => console.log("Audio blocked:", err));

      // Start DVD-style bouncing
      if (!dvdAnimationStarted) {
        dvdAnimationStarted = true;
        startDVDBounce();
      }
    });

    /* ---- DVD-STYLE MOVEMENT ---- */
    let containerWidth = window.innerWidth;
    let containerHeight = window.innerHeight;
    let x = Math.random() * (containerWidth - enter.offsetWidth);
    let y = Math.random() * (containerHeight - enter.offsetHeight);
    let dx = 3;
    let dy = 3;

    function startDVDBounce() {
      function move() {
        x += dx;
        y += dy;

        if (x + enter.offsetWidth >= containerWidth || x <= 0) dx = -dx;
        if (y + enter.offsetHeight >= containerHeight || y <= 0) dy = -dy;

        enter.style.left = x + "px";
        enter.style.top = y + "px";

        requestAnimationFrame(move);
      }
      move();
    }

    enter.addEventListener("click", (e) => {
      e.preventDefault();
      window.location.href = "home.html";
    });

    window.addEventListener("resize", () => {
      containerWidth = window.innerWidth;
      containerHeight = window.innerHeight;
    });
  </script>

</body>
</html>
