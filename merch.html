<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Merch — Radhika.world</title>

  <style>
    /* ---- GLITCH ANIMATION ---- */
    @keyframes glitch-anim {
      0% { clip: rect(24px, 9999px, 90px, 0); transform: skew(0.3deg); }
      10% { clip: rect(10px, 9999px, 50px, 0); transform: skew(0.8deg); }
      20% { clip: rect(50px, 9999px, 140px, 0); transform: skew(0.1deg); }
      30% { clip: rect(80px, 9999px, 120px, 0); transform: skew(0.5deg); }
      40% { clip: rect(20px, 9999px, 100px, 0); transform: skew(0.6deg); }
      50% { clip(60px, 9999px, 150px, 0); transform: skew(0.2deg); }
      60% { clip(5px, 9999px, 80px, 0); transform: skew(0.4deg); }
      70% { clip(30px, 9999px, 130px, 0); transform: skew(0.7deg); }
      80% { clip(10px, 9999px, 90px, 0); transform: skew(0.9deg); }
      90% { clip(40px, 9999px, 110px, 0); transform: skew(0.3deg); }
      100% { clip(24px, 9999px, 90px, 0); transform: skew(0.5deg); }
    }

    /* ---- BODY ---- */
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black; /* landing background */
      flex-direction: column;
    }

    /* ---- LANDING ENTER BUTTON ---- */
    #enter-btn {
      font-size: 2rem;
      color: white;
      background: none;
      border: 2px solid white;
      padding: 0.5rem 2rem;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    #enter-btn:hover {
      background: white;
      color: black;
    }

    /* ---- HEADER ---- */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 90px;
      background: black; /* black top border */
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      display: none; /* hide until Enter clicked */
    }

    .glitch {
      font-family: 'Courier New', monospace;
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: white;
      text-transform: uppercase;
      position: relative;
      white-space: nowrap;
      text-decoration: none;
      text-shadow: 0 0 1px white, 0 0 2px white, 0 0 5px white;
    }

    .glitch::before,
    .glitch::after {
      content: "Radhika.world";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      clip: rect(0, 0, 0, 0);
    }

    .glitch::before {
      text-shadow: -2px 0 cyan;
      animation: glitch-anim 2s infinite linear alternate-reverse;
    }

    .glitch::after {
      text-shadow: 2px 0 magenta;
      animation: glitch-anim 3s infinite linear alternate-reverse;
    }

    /* ---- MAIN MERCH ---- */
    main {
      padding-top: 140px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 140px);
      position: relative;
      display: none; /* hide until Enter clicked */
      background: white; /* white background */
      width: 100%;
      flex-direction: column;
    }

    .carousel {
      width: 360px;
      overflow: hidden;
    }

    .track {
      display: flex;
      transition: transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .item {
      min-width: 360px;
      text-align: center;
      cursor: pointer;
    }

    .item video {
      width: 100%;
      border: 2px solid black;
      display: block;
    }

    .item p {
      margin-top: 12px;
      letter-spacing: 0.15em;
      font-size: 1rem;
      color: black;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2.5rem;
      background: none;
      border: none;
      cursor: pointer;
      color: black;
      padding: 0 10px;
      user-select: none;
    }

    .arrow:hover {
      transform: translateY(-50%) scale(1.2);
    }

    .arrow.left {
      left: 40px;
    }

    .arrow.right {
      right: 40px;
    }
  </style>
</head>

<body>

  <!-- Background Music -->
  <audio id="bg-music" loop preload="auto">
    <source src="videos/NuSong.wav" type="audio/wav">
  </audio>

  <!-- Landing Enter Button -->
  <button id="enter-btn">Enter</button>

  <!-- HEADER -->
  <header>
    <a href="#" class="glitch">Radhika.world</a>
  </header>

  <!-- MAIN MERCH CAROUSEL -->
  <main>
    <button class="arrow left" onclick="prev()">←</button>

    <div class="carousel">
      <div class="track" id="track">
        <div class="item" onclick="goToItem(1)">
          <video src="videos/merch1.mp4" muted autoplay loop playsinline></video>
          <p>Scarboro Football Tee</p>
        </div>

        <div class="item" onclick="goToItem(2)">
          <video src="videos/merch2.mp4" muted autoplay loop playsinline></video>
          <p>ITEM 002</p>
        </div>

        <div class="item" onclick="goToItem(3)">
          <video src="videos/merch3.mp4" muted autoplay loop playsinline></video>
          <p>ITEM 003</p>
        </div>
      </div>
    </div>

    <button class="arrow right" onclick="next()">→</button>
  </main>

  <script>
    const enterBtn = document.getElementById("enter-btn");
    const header = document.querySelector("header");
    const main = document.querySelector("main");
    const music = document.getElementById("bg-music");

    enterBtn.addEventListener("click", () => {
      // Hide landing
      enterBtn.style.display = "none";

      // Show merch page
      header.style.display = "flex";
      main.style.display = "flex";
      document.body.style.background = "white"; // set background white for page

      // Play music
      music.volume = 0.5;
      music.muted = false;
      music.play().catch(err => console.log("Audio blocked:", err));
    });

    /* ---- CAROUSEL LOGIC ---- */
    const track = document.getElementById("track");
    const itemWidth = 360;
    const totalItems = document.querySelectorAll(".item").length;
    let index = 0;

    function update() {
      track.style.transform = `translateX(-${index * itemWidth}px)`;
    }

    function next() {
      if (index < totalItems - 1) {
        index++;
        update();
      }
    }

    function prev() {
      if (index > 0) {
        index--;
        update();
      }
    }

    function goToItem(num) {
      window.location.href = `merch-item-${num}.html`;
    }
  </script>

</body>
</html>
