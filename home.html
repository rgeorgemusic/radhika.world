<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radhika.World</title>

  <style>
    @keyframes glitch-anim {
      0% { clip: rect(24px, 9999px, 90px, 0); transform: skew(0.3deg); }
      10% { clip: rect(10px, 9999px, 50px, 0); transform: skew(0.8deg); }
      20% { clip: rect(50px, 9999px, 140px, 0); transform: skew(0.1deg); }
      30% { clip: rect(80px, 9999px, 120px, 0); transform: skew(0.5deg); }
      40% { clip: rect(20px, 9999px, 100px, 0); transform: skew(0.6deg); }
      50% { clip: rect(60px, 9999px, 150px, 0); transform: skew(0.2deg); }
      60% { clip: rect(5px, 9999px, 80px, 0); transform: skew(0.4deg); }
      70% { clip: rect(30px, 9999px, 130px, 0); transform: skew(0.7deg); }
      80% { clip: rect(10px, 9999px, 90px, 0); transform: skew(0.9deg); }
      90% { clip: rect(40px, 9999px, 110px, 0); transform: skew(0.3deg); }
      100% { clip: rect(24px, 9999px, 90px, 0); transform: skew(0.5deg); }
    }

    body {
      background-color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      overflow: hidden;
      height: 100vh;
      position: relative;
    }

    /* Top & Bottom Bars */
    .radhika-section {
      position: absolute;
      width: 100%;
      left: 0;
      z-index: 10;
      background-color: black;
      overflow: hidden;
      height: 80px;
    }

    .top-section { top: 0; }
    .bottom-section { bottom: 0; }

    /* Glitch Text */
    .glitch {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      position: absolute;
      color: white;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 0 0 1px white;
    }

    .glitch::before,
    .glitch::after {
      content: "Radhika.World";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }

    .glitch::before {
      text-shadow: -2px 0 cyan;
      animation: glitch-anim 2s infinite linear alternate-reverse;
    }

    .glitch::after {
      text-shadow: 2px 0 magenta;
      animation: glitch-anim 3s infinite linear alternate-reverse;
    }

    /* Center Video (No Border / No Shadow) */
    .video-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      width: 70%;
      max-width: 900px;
      pointer-events: none;
    }

    .video-container video {
      width: 100%;
      height: auto;
      border: none;
      outline: none;
      box-shadow: none;
      background: transparent;
      display: block;
    }

    /* Menu */
    .menu-container {
      position: absolute;
      bottom: 100px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 2rem;
      z-index: 30;
    }

    .menu {
      font-size: 1.5rem;
      font-weight: bold;
      color: #222;
      background-color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border: 2px solid #444;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .menu:hover {
      background-color: #000;
      color: #fff;
      text-shadow: 0 0 5px white, 0 0 10px cyan, 0 0 10px magenta;
      border-color: #fff;
    }
  </style>
</head>

<body>

  <!-- Top Bar -->
  <div class="radhika-section top-section">
    <div class="glitch" id="textTop">Radhika.World</div>
  </div>

  <!-- Center Video -->
  <div class="video-container">
    <video autoplay muted loop playsinline>
      <source src="videos/Fran.MP4" type="video/mp4">
    </video>
  </div>

  <!-- Menu -->
  <div class="menu-container">
    <a href="music.html" class="menu">MUSIC</a>
    <a href="photography.html" class="menu">FILM PHOTOGRAPHY</a>
    <a href="merch.html" class="menu">MERCH</a>
    <a href="gallery.html" class="menu">GALLERY</a>
  </div>

  <!-- Bottom Bar -->
  <div class="radhika-section bottom-section">
    <div class="glitch" id="textBottom">Radhika.World</div>
  </div>

  <script>
    const topText = document.getElementById('textTop');
    const bottomText = document.getElementById('textBottom');

    let xTop = 0;
    let xBottom = 0;
    let dxTop = 2;
    let dxBottom = 2;
    const padding = 20;

    function animate() {
      const maxX = window.innerWidth - topText.offsetWidth;

      xTop += dxTop;
      xBottom += dxBottom;

      if (xTop >= maxX || xTop <= 0) dxTop = -dxTop;
      if (xBottom >= maxX || xBottom <= 0) dxBottom = -dxBottom;

      topText.style.top = padding + 'px';
      topText.style.left = xTop + 'px';

      bottomText.style.top = padding + 'px';
      bottomText.style.left = xBottom + 'px';

      requestAnimationFrame(animate);
    }

    animate();
  </script>

</body>
</html>
